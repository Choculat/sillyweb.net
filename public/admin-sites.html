<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/kitty.png">
  <meta name="description" content="A tiny, free place to keep a website you made yourself. Write your HTML, CSS and JavaScript in the browser, hit publish, and it lives at yourname.sillyweb.net.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="sillyweb.net">
  <meta property="og:title" content="sillyweb.net, a small free home for handmade websites">
  <meta property="og:description" content="Write it yourself in the browser, hit publish, and your page lives at yourname.sillyweb.net. Free, forever.">
  <meta property="og:url" content="https://sillyweb.net/">
  <meta property="og:image" content="https://sillyweb.net/assets/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="sillyweb.net on lined paper beside a pencil drawing of a sleepy cat">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="sillyweb.net, a small free home for handmade websites">
  <meta name="twitter:description" content="Write it yourself in the browser, hit publish, and your page lives at yourname.sillyweb.net. Free, forever.">
  <meta name="twitter:image" content="https://sillyweb.net/assets/og.png">
  <title>All sites - sillyweb.net</title>
  <link rel="stylesheet" href="/css/base.css?v=5">
  <link rel="stylesheet" href="/css/components.css?v=2">
  <link rel="stylesheet" href="/css/modal.css?v=1">
  <link rel="stylesheet" href="/css/responsive.css?v=1">
  <script src="/theme.js"></script>
</head>
<body>
  <div class="wrap wide">
    <nav><a href="/">Home</a> <a href="/dashboard">Dashboard</a> <a href="/account">Account</a> <a href="#" id="signout">Sign out</a></nav>
    <h1>All sites</h1>
    <p><a href="/admin" class="back-link">‹ Admin</a></p>
    <p class="error" id="error"></p>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Site</th><th>Domain</th><th>Updated</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="sites"></tbody>
      </table>
    </div>
  </div>

  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    async function load() {
      const res = await fetch('/api/admin/pages');
      const { pages } = await res.json();
      document.getElementById('sites').innerHTML = pages.map((p) => `
        <tr>
          <td><a href="https://${esc(p.username)}.sillyweb.net/" target="_blank">${esc(p.username)}</a></td>
          <td>${esc(p.custom_domain || '')}</td>
          <td>${esc(p.updated_at)}</td>
          <td>${p.suspended ? 'suspended' : 'live'}</td>
          <td><button type="button" class="btn-secondary suspend-btn" data-id="${p.id}" data-next="${p.suspended ? 0 : 1}">${p.suspended ? 'Unsuspend' : 'Suspend'}</button></td>
        </tr>
      `).join('');

      document.querySelectorAll('.suspend-btn').forEach((el) => {
        el.addEventListener('click', async () => {
          const res = await fetch(`/api/admin/pages/${el.dataset.id}/suspend`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ suspended: el.dataset.next === '1' }),
          });
          if (!res.ok) {
            document.getElementById('error').textContent = (await res.json()).error;
            return;
          }
          load();
        });
      });
    }

    document.getElementById('signout').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/signout', { method: 'POST' });
      location.href = '/';
    });

    load();
  </script>
</body>
</html>
