<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/kitty.png">
  <meta name="description" content="A tiny, free place to keep a website you made yourself. Write your HTML, CSS and JavaScript in the browser, hit publish, and it lives at yourname.sillyweb.net.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="sillyweb.net">
  <meta property="og:title" content="sillyweb.net, a small free home for handmade websites">
  <meta property="og:description" content="Write it yourself in the browser, hit publish, and your page lives at yourname.sillyweb.net. Free, forever.">
  <meta property="og:url" content="https://sillyweb.net/">
  <meta property="og:image" content="https://sillyweb.net/assets/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="sillyweb.net on lined paper beside a pencil drawing of a sleepy cat">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="sillyweb.net, a small free home for handmade websites">
  <meta name="twitter:description" content="Write it yourself in the browser, hit publish, and your page lives at yourname.sillyweb.net. Free, forever.">
  <meta name="twitter:image" content="https://sillyweb.net/assets/og.png">
  <title>sillyweb.net, a small free home for handmade websites</title>
  <link rel="stylesheet" href="/css/base.css?v=5">
  <link rel="stylesheet" href="/css/components.css?v=2">
  <link rel="stylesheet" href="/css/modal.css?v=1">
  <link rel="stylesheet" href="/css/responsive.css?v=1">
  <script src="/theme.js"></script>
</head>
<body class="centered-page">
  <div class="wrap landing-wrap">
    <nav id="nav">
      <a href="/signin">Sign in</a>
      <a href="/signup">Sign up</a>
    </nav>
    <h1>sillyweb.net</h1>
    <p class="tagline">Free static page hosting, forever!</p>
    <img src="/assets/kitty.png" alt="a kitty" class="hero-image">
    <p class="image-credit">Art by <a href="https://www.instagram.com/paniniartgallery/" target="_blank">@paniniartgallery</a></p>
    <p class="image-credit"><a href="https://github.com/Choculat/sillyweb.net" target="_blank">Open source on GitHub</a></p>
  </div>

  <script>
    fetch('/api/me').then((r) => r.json()).then(({ user }) => {
      if (!user) return;
      document.getElementById('nav').innerHTML =
        '<a href="/dashboard">Dashboard</a> <a href="#" id="signout">Sign out</a>';
      document.getElementById('signout').addEventListener('click', async (e) => {
        e.preventDefault();
        await fetch('/api/signout', { method: 'POST' });
        location.reload();
      });
    });
  </script>
</body>
</html>
