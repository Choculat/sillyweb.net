<html>
<head>

  <meta name="twitter:card" content="summary_large_image">

  <title>Sign in - sillyweb.net</title>
  <link rel="stylesheet" href="/css/base.css?v=5">
  <link rel="stylesheet" href="/css/components.css?v=2">
  <link rel="stylesheet" href="/css/modal.css?v=1">
  <link rel="stylesheet" href="/css/responsive.css?v=1">
  <script src="/theme.js"></script>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>
<body class="centered-page">
  <div class="wrap">
    <nav><a href="/">Home</a> <a href="/signup">Sign up</a></nav>
    <h1>Sign in</h1>
    <p class="error" id="error"></p>
    <p id="notice" style="display:none"></p>
    <form id="form">
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <div class="h-captcha" data-sitekey="78bc11c6-ca7c-4336-8bb4-2f0ce506e810"></div>
      <button type="submit">Sign in</button>
    </form>
    <p><a href="#" id="forgot">Forgot your password?</a></p>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      body.captcha = body['h-captcha-response'];
      const res = await fetch('/api/signin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('error').textContent = data.error;
        if (window.hcaptcha) hcaptcha.reset();
        return;
      }
      location.href = '/dashboard';
    });

    document.getElementById('forgot').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.querySelector('input[name=email]').value;
      if (!email) return document.getElementById('error').textContent = 'Enter your email above first, then click again.';
      const captcha = (document.querySelector('[name=h-captcha-response]') || {}).value;
      if (!captcha) return document.getElementById('error').textContent = 'Complete the captcha above first, then click again.';
      const res = await fetch('/api/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, captcha }) });
      const data = await res.json();
      if (window.hcaptcha) hcaptcha.reset();
      document.getElementById('error').textContent = '';
      const notice = document.getElementById('notice');
      notice.style.display = 'block';
      notice.textContent = data.message;
    });
  </script>
</body>
</html>
