<!doctype html>
<html>
<head>

  <link rel="icon" type="image/png" href="/assets/kitty.png">
  <title>Admin - sillyweb.net</title>
  <link rel="stylesheet" href="/css/base.css">

<body>

      <li><a href="/admin/sites">All sites</a></li>
    </ul>

  <script>
    document.getElementById('signout').addEventListener('click', async (e) => {

      await fetch('/api/signout', { method: 'POST' });
      location.href = '/';
    });
  </script>
</body>
