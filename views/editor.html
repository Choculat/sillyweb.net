<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/kitty.png">
  <title>Editor - sillyweb.net</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/modal.css">
  <link rel="stylesheet" href="/css/editor.css">
  <link rel="stylesheet" href="/css/editor-preview.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/theme.js"></script>
  <script src="/vendor/monaco/vs/loader.js"></script>
</head>
<body class="editor-page">
  <div class="ide">
    <div class="ide-topbar">
      <button id="tree-toggle" class="tree-toggle-btn" title="Files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="/dashboard" class="ide-back">‹ Dashboard</a>
      <span class="ide-topbar-right">
        <span id="save-status"></span>
        <span class="error" id="error"></span>
        <span class="view-modes">
          <button class="view-mode-btn" data-mode="code">Code</button>
          <button class="view-mode-btn active" data-mode="split">Both</button>
          <button class="view-mode-btn" data-mode="preview">Preview</button>
        </span>
        <a id="view-link" target="_blank">Open site ↗</a>
      </span>
    </div>

    <div class="ide-body">
      <div class="ide-tree-backdrop" id="tree-backdrop"></div>
      <div class="ide-tree" id="tree">
        <div class="ide-tree-header">
          <div class="ide-tree-heading">
            <span>Explorer</span>
            <span class="tree-actions">
              <button type="button" id="new-file" class="icon-btn" title="New File" aria-label="New File">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
              </button>
              <button type="button" id="new-folder" class="icon-btn" title="New Folder" aria-label="New Folder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
              </button>
            </span>
          </div>
          <span id="tree-usage"></span>
        </div>
        <div id="files"></div>
        <div id="upload-progress" class="upload-progress"></div>
      </div>

      <div class="ide-main" id="ide-main">
        <div class="ide-editor" id="editor-pane">
          <div class="ide-tab" id="file-tab">
            <span id="current-file">Select a file</span>
            <span class="tab-actions">
              <button id="save" class="btn-secondary">Save</button>
              <button id="publish">Publish</button>
            </span>
          </div>
          <textarea id="code" spellcheck="false" placeholder="Select a text file on the left to edit it."></textarea>
          <div id="monaco-container" style="display:none"></div>
          <div id="code-loading" style="display:none"><span>Loading editor…</span></div>
          <div id="binary-preview" style="display:none"></div>
          <div id="empty-state" style="display:none">
            <p>This site has no files yet.</p>
            <button id="empty-create">Create a file to get started</button>
          </div>
        </div>

        <div class="ide-resizer" id="resizer"></div>

        <div class="ide-preview" id="preview-pane">
          <div class="ide-tab">
            <span>Preview</span>
            <span class="preview-devices">
              <button class="icon-btn" data-device="desktop" title="Desktop">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
              </button>
              <button class="icon-btn" data-device="mobile" title="Mobile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
              </button>
            </span>
          </div>
          <div class="preview-viewport">
            <p class="preview-notice" id="preview-notice" style="display:none"></p>
            <div class="device-frame" id="device-frame">
              <div class="device-screen">
                <iframe id="preview" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
                <iframe id="preview-next" class="preview-back" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
              </div>
              <div class="resize-handle" data-corner="tl"></div>
              <div class="resize-handle" data-corner="tr"></div>
              <div class="resize-handle" data-corner="bl"></div>
              <div class="resize-handle" data-corner="br"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="context-menu" class="context-menu"></div>
  <input type="file" id="upload-input" multiple style="display:none">

  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <p class="modal-message" id="modal-message"></p>
      <input id="modal-input" class="modal-input" list="modal-suggest" autocomplete="off" style="display:none">
      <datalist id="modal-suggest"></datalist>
      <ul class="modal-list" id="modal-list" style="display:none"></ul>
      <p class="modal-error" id="modal-error" style="display:none"></p>
      <label class="modal-checkbox" id="modal-applyall" style="display:none">
        <input type="checkbox" id="modal-applyall-input">
        <span id="modal-applyall-label"></span>
      </label>
      <div class="modal-actions" id="modal-choices" style="display:none"></div>
      <div class="modal-actions" id="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <script src="/editor/state.js"></script>
  <script src="/editor/monaco.js"></script>
  <script src="/editor/modal.js"></script>
  <script src="/editor/tree.js"></script>
  <script src="/editor/actions.js"></script>
  <script src="/editor/uploads.js"></script>
  <script src="/editor/files.js"></script>
  <script src="/editor/layout.js"></script>
  <script src="/editor/boot.js"></script>
</body>
</html>
