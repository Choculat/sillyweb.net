<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/kitty.png">
  <title>Reset password - sillyweb.net</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/modal.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/theme.js"></script>
</head>
<body class="centered-page">
  <div class="wrap">
    <nav><a href="/">Home</a> <a href="/signin">Sign in</a></nav>
    <h1>Set a new password</h1>
    <p class="error" id="error"></p>
    <p id="success" style="display:none">Password updated. You can now <a href="/signin">sign in</a>.</p>
    <form id="form">
      <input name="newPassword" type="password" placeholder="New password" required>
      <p><small>8+ characters, one uppercase letter, one number, one special character.</small></p>
      <button type="submit">Update password</button>
    </form>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = e.target.newPassword.value;
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword }),
      });
      const data = await res.json();
      if (!res.ok) return document.getElementById('error').textContent = data.error;
      e.target.style.display = 'none';
      document.getElementById('error').textContent = '';
      document.getElementById('success').style.display = 'block';
    });
  </script>
</body>
</html>
