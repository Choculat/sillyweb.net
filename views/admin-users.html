<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/kitty.png">
  <title>All users - sillyweb.net</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/modal.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/theme.js"></script>
</head>
<body>
  <div class="wrap wide">
    <nav><a href="/">Home</a> <a href="/dashboard">Dashboard</a> <a href="/account">Account</a> <a href="#" id="signout">Sign out</a></nav>
    <h1>All users</h1>
    <p><a href="/admin" class="back-link">‹ Admin</a></p>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Username</th><th>Email</th><th>Admin</th><th>Joined</th></tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
    </div>
  </div>

  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    async function load() {
      const res = await fetch('/api/admin/users');
      const { users } = await res.json();
      const body = document.getElementById('users');
      body.innerHTML = users.map((u) => `
        <tr>
          <td>${esc(u.username)}</td>
          <td>${esc(u.email)}</td>
          <td>${u.is_admin ? 'yes' : 'no'}</td>
          <td>${esc(u.created_at)}</td>
        </tr>
      `).join('');
    }

    document.getElementById('signout').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/signout', { method: 'POST' });
      location.href = '/';
    });

    load();
  </script>
</body>
</html>
